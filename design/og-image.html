<!doctype html>
<!-- SNS でリンクを貼ったときのサムネイル（1200x630）。作り直すときは README の手順で PNG に書き出す -->
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(1000px 520px at 85% 110%, #3a0c16 0%, transparent 70%), linear-gradient(160deg, #1a0a0d 0%, #0e0f12 55%);
    color: #e9eaee; font-family: "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif;
    display: flex; padding: 64px 72px; box-sizing: border-box; gap: 56px;
  }
  .left { flex: 1; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .logo { width: 64px; height: 64px; border-radius: 16px; background: #c8102e; display: grid; place-items: center; font-weight: 800; font-size: 26px; color: #fff; }
  .brand span { font-size: 26px; color: #b9bdc7; font-weight: 700; letter-spacing: .04em; }
  h1 { font-size: 82px; line-height: 1.1; margin: 44px 0 20px; font-weight: 800; letter-spacing: .01em; }
  p { font-size: 30px; line-height: 1.55; color: #c9ccd3; margin: 0; font-weight: 600; }
  .tags { display: flex; gap: 14px; margin-top: auto; }
  .tag { font-size: 26px; font-weight: 800; padding: 8px 20px; border-radius: 999px; }
  .buff { color: #60a5fa; background: rgba(59,130,246,.18); }
  .nerf { color: #f87171; background: rgba(239,68,68,.18); }
  .change { color: #facc15; background: rgba(234,179,8,.18); }
  .right { width: 400px; display: flex; flex-direction: column; justify-content: center; }
  .card { background: #17191e; border: 2px solid #2b2f37; border-radius: 22px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .card .head { display: flex; align-items: center; gap: 14px; padding: 20px 22px; border-bottom: 2px solid #2b2f37; }
  .card .icon { width: 50px; height: 50px; border-radius: 50%; background: #2a1418; color: #f3a7b4; display: grid; place-items: center; font-size: 24px; font-weight: 800; }
  .card .name { font-size: 26px; font-weight: 800; }
  .card .kind { font-size: 17px; color: #8b909c; margin-top: 2px; }
  .card .row { display: flex; gap: 12px; align-items: baseline; padding: 16px 22px; font-size: 24px; }
  .card .row + .row { border-top: 2px dashed #2b2f37; }
  .before { color: #8b909c; text-decoration: line-through; text-decoration-color: rgba(239,68,68,.7); }
  .after { font-weight: 800; }
  .mark { width: 28px; flex: none; text-align: center; }
  .note { font-size: 17px; color: #6b7080; margin-top: 16px; text-align: right; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand"><div class="logo">DbD</div><span>Dead by Daylight 非公式まとめ</span></div>
    <h1>DbD パッチ速報</h1>
    <p>公式パッチノートの<br>強化・弱体化がひと目でわかる</p>
    <div class="tags"><span class="tag buff">▲ 強化</span><span class="tag nerf">▼ 弱体化</span><span class="tag change">● 変更</span></div>
  </div>
  <div class="right">
    <!-- 実データ: 10.2.0「憎悪の囁き」 -->
    <div class="card">
      <div class="head"><div class="icon">憎</div><div><div class="name">憎悪の囁き</div><div class="kind">キラーパーク ・ <span style="color:#60a5fa;font-weight:800">▲ 強化</span></div></div></div>
      <div class="row"><span class="mark">❌</span><span class="before">16メートル・5秒</span></div>
      <div class="row"><span class="mark">⭕</span><span class="after">20メートル・10秒</span></div>
    </div>
    <div class="note">Ver 10.2.0 の例</div>
  </div>
</body>
</html>
