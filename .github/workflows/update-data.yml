# Steam の公式パッチノートを定期的に取得して data/ を更新する。
# 変更があったときだけコミットする。GitHub Actions は公開リポジトリなら無料。
name: Update patch data

on:
  schedule:
    - cron: "17 */3 * * *" # 3時間ごと（混雑する毎時0分を避ける）
  workflow_dispatch: # Actions 画面から手動実行もできる

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run update
        env:
          MAX_PAGES: "1" # 新しい100件だけ見れば十分
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "Update patch data"
          git push
